name: Feature request
description: A new rule, code fix, configuration option or pattern the analyzer should recognize.
labels: [enhancement]
body:
  - type: dropdown
    id: kind
    attributes:
      label: Kind of feature
      options:
        - New rule or new allocation to detect
        - New or improved code fix
        - Configuration option
        - Source generator ([ObjectPool])
        - Automatic suppression of a safe pattern
        - Documentation
        - Other
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What costs you time or frames today? Include a profiler observation if you have one.
    validations:
      required: true

  - type: textarea
    id: example
    attributes:
      label: Example code
      description: Code the feature should act on, and what it should report or rewrite it to.
      render: csharp

  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: What the analyzer should do, and the default severity you would expect.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Workarounds you use today, or other ways this could work.
