name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  # Checks that do not depend on the operating system run once, on Linux, next to the build matrix.
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      # GitHub Actions sets CI=true, so Directory.Build.props turns NuGet audit warnings (NU1901 to
      # NU1904) into errors and a vulnerable package, direct or transitive, fails this step.
      - name: Restore
        run: dotnet restore ObjectPoolLinter.slnx

      - name: Check for vulnerable packages
        shell: pwsh
        run: ./build/check-vulnerable.ps1

      # Enforces the root .editorconfig. samples/ is excluded because the sample exists to trigger the
      # analyzers, and dotnet format would apply their code fixes to it.
      - name: Check formatting
        run: dotnet format ObjectPoolLinter.slnx --verify-no-changes --no-restore --exclude samples/

  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore ObjectPoolLinter.slnx

      - name: Build
        run: dotnet build ObjectPoolLinter.slnx -c Release --no-restore -warnaserror

      # Test sources compile against .NET Standard 2.1, the default profile of Unity 2021.3, the oldest
      # Unity the package supports (tests/ObjectPoolLinter.Tests/TestReferenceAssemblies.cs). This run
      # also collects coverage of the shipped assemblies.
      - name: Test (oldest reference assemblies)
        run: >-
          dotnet test ObjectPoolLinter.slnx -c Release --no-build
          --logger "trx;LogFileName=test-results.trx"
          --results-directory artifacts/test-results
          --collect:"XPlat Code Coverage"
          --settings tests/ObjectPoolLinter.Tests/coverage.runsettings

      - name: Test (newest reference assemblies)
        env:
          OPL_TEST_REFERENCE_ASSEMBLIES: newest
        run: >-
          dotnet test ObjectPoolLinter.slnx -c Release --no-build
          --logger "trx;LogFileName=test-results-newest.trx"
          --results-directory artifacts/test-results

      - name: Check coverage
        shell: pwsh
        run: ./build/check-coverage.ps1 -ResultsDirectory artifacts/test-results

      - name: Verify sample diagnostics
        shell: pwsh
        run: ./build/verify-sample.ps1 -Configuration Release -NoDependencies

      - name: Pack
        run: dotnet pack src/ObjectPoolLinter.Package/ObjectPoolLinter.Package.csproj -c Release --no-build -o artifacts/nuget

      # nuget.org validates a .snupkg only after it is pushed. This checks the same things first:
      # portable PDBs only, one per shipped DLL, each matching its DLL's debug id, with Source Link.
      - name: Verify symbol package
        run: dotnet run --file build/verify-symbols.cs -- artifacts/nuget

      # Also the check that unity/package.json.in has every placeholder replaced: pack-unity.ps1 reads
      # package.json back out of the tarball and fails on a leftover __NAME__ or a wrong version.
      - name: Pack Unity
        shell: pwsh
        run: ./build/pack-unity.ps1 -SkipBuild

      # Every platform packs, so a platform-specific packing failure shows up, but the packages from
      # Linux are the ones kept: the release workflow builds on Linux too.
      - name: Upload packages
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: nuget
          path: |
            artifacts/nuget/*.nupkg
            artifacts/nuget/*.snupkg
          if-no-files-found: error

      - name: Upload Unity packages
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: unity
          path: |
            artifacts/unity/*.unitypackage
            artifacts/unity/*.tgz
          if-no-files-found: error

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ runner.os }}
          path: artifacts/test-results
          if-no-files-found: ignore
