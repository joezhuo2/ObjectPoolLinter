name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  # Lets the job request the GitHub OIDC token that NuGet/login exchanges for a nuget.org API key, and
  # that the attest actions exchange for a short-lived Sigstore signing certificate.
  id-token: write
  # Lets the attest actions store the signed provenance and SBOM attestations on the repository.
  attestations: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      # The tag is the version: v1.2.3 packs as 1.2.3, v1.2.3-rc.1 as 1.2.3-rc.1. Anything that is not
      # SemVer fails here rather than producing a package nuget.org would reject. 0.x tags are a dry
      # run: 1.0.0 is the first published release, so they build every artifact but publish nothing.
      - name: Resolve version
        id: version
        run: |
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Tag '$tag' is not v<major>.<minor>.<patch>[-prerelease]."
            exit 1
          fi
          prerelease=false
          [[ "$version" == *-* ]] && prerelease=true
          publish=true
          [[ "$version" == 0.* ]] && publish=false
          {
            echo "version=$version"
            echo "prerelease=$prerelease"
            echo "publish=$publish"
          } >> "$GITHUB_OUTPUT"
          echo "Version $version (prerelease: $prerelease, publish: $publish)"

      # A tag signed with a GPG or SSH key that GitHub knows for its author shows as "Verified". The
      # released files are signed by the attestation steps below whatever the tag, so an unsigned or
      # lightweight tag is reported as a warning rather than failing the release.
      - name: Check tag signature
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ref=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${GITHUB_REF_NAME}")
          if [ "$(jq -r '.object.type' <<< "$ref")" != "tag" ]; then
            echo "::warning::${GITHUB_REF_NAME} is a lightweight tag, so it cannot be signed. Use 'git tag -s'."
            exit 0
          fi
          tag=$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/$(jq -r '.object.sha' <<< "$ref")")
          if [ "$(jq -r '.verification.verified' <<< "$tag")" = "true" ]; then
            echo "Tag ${GITHUB_REF_NAME} has a verified signature."
          else
            echo "::warning::Tag ${GITHUB_REF_NAME} is not signed with a verified key ($(jq -r '.verification.reason' <<< "$tag")). Use 'git tag -s'."
          fi

      # The tag overrides <Version> with -p:Version, but local builds and pack-unity.ps1 without
      # -Version read the csproj value. Fail when the two disagree so the csproj never goes stale.
      - name: Check csproj version matches tag
        run: |
          csproj=src/ObjectPoolLinter.Package/ObjectPoolLinter.Package.csproj
          declared=$(grep -oP '(?<=<Version>)[^<]+' "$csproj" | head -n 1)
          if [ "$declared" != "${{ steps.version.outputs.version }}" ]; then
            echo "::error file=$csproj::<Version> is '$declared' but the tag is '${GITHUB_REF_NAME}'. Bump the csproj before tagging."
            exit 1
          fi
          echo "csproj <Version> $declared matches the tag."

      # The release notes are the CHANGELOG section whose heading names this tag. A tag with no
      # section fails the run, so every release has notes.
      - name: Extract release notes
        run: |
          mkdir -p artifacts
          awk -v tag="${GITHUB_REF_NAME}" '
            index($0, "## [" tag "]") == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found && /^\[[^]]+\]: / { exit }
            found { print }
          ' CHANGELOG.md > artifacts/release-notes.md
          if ! grep -q '[^[:space:]]' artifacts/release-notes.md; then
            echo "::error::CHANGELOG.md has no '## [${GITHUB_REF_NAME}]' section, or it is empty."
            exit 1
          fi
          cat artifacts/release-notes.md

      - name: Restore
        run: dotnet restore ObjectPoolLinter.slnx

      - name: Build
        run: >-
          dotnet build ObjectPoolLinter.slnx -c Release --no-restore -warnaserror
          -p:Version=${{ steps.version.outputs.version }}

      - name: Test
        run: dotnet test ObjectPoolLinter.slnx -c Release --no-build

      - name: Pack NuGet
        run: >-
          dotnet pack src/ObjectPoolLinter.Package/ObjectPoolLinter.Package.csproj -c Release --no-build
          -p:Version=${{ steps.version.outputs.version }} -o artifacts/nuget

      # nuget.org validates the .snupkg only after the push, when the .nupkg is already public.
      - name: Verify symbol package
        run: dotnet run --file build/verify-symbols.cs -- artifacts/nuget

      - name: Pack Unity
        shell: pwsh
        run: ./build/pack-unity.ps1 -SkipBuild -Version '${{ steps.version.outputs.version }}'

      # The files that ship, gathered in one place so the SBOM and the attestations cover exactly them.
      - name: Collect release files
        run: |
          mkdir -p artifacts/release
          cp artifacts/nuget/*.nupkg artifacts/nuget/*.snupkg artifacts/unity/*.unitypackage artifacts/unity/*.tgz \
            artifacts/release/

      # SPDX 2.2 SBOM from Microsoft's sbom-tool: every release file with its SHA-256, and every NuGet
      # package the shipped projects restore (from their project.assets.json). The .nuspec files pack
      # leaves in obj/ are deleted first so the package does not list itself as its own dependency.
      - name: Generate SBOM
        run: |
          version="${{ steps.version.outputs.version }}"
          dotnet tool install --global Microsoft.Sbom.DotNetTool --version 4.1.13
          find src -path '*/obj/*' -name '*.nuspec' -delete
          sbom-tool generate -b artifacts/release -bc src -pn ObjectPoolLinter -pv "$version" \
            -ps "Joe Zhuo" -nsb "https://github.com/${GITHUB_REPOSITORY}" -V Warning \
            -cd "--DirectoryExclusionList **/bin/**"
          mv artifacts/release/_manifest/spdx_2.2/manifest.spdx.json "artifacts/ObjectPoolLinter-$version.spdx.json"
          rm -rf artifacts/release/_manifest

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ steps.version.outputs.version }}
          path: |
            artifacts/release-notes.md
            artifacts/release/*
            artifacts/*.spdx.json
          if-no-files-found: error

      # Sigstore signing through GitHub artifact attestations: each release file gets a signed SLSA
      # build provenance statement tying its SHA-256 to this repository, workflow and commit, and a
      # signed statement binding the SBOM to it. Keyless: the signing certificate is issued for this
      # run's OIDC identity, and the signatures are recorded in Sigstore's public transparency log.
      # Anyone can check a download with `gh attestation verify <file> --repo <owner>/<repo>`.
      - name: Attest build provenance
        if: steps.version.outputs.publish == 'true'
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: artifacts/release/*

      - name: Attest SBOM
        if: steps.version.outputs.publish == 'true'
        uses: actions/attest-sbom@v4
        with:
          subject-path: artifacts/release/*
          sbom-path: artifacts/ObjectPoolLinter-${{ steps.version.outputs.version }}.spdx.json

      # Trusted Publishing: the job's GitHub OIDC token is exchanged for a short-lived nuget.org API
      # key (valid for one hour), so no long-lived key is stored in the repository. nuget.org only
      # issues the key if a Trusted Publishing policy on the NUGET_USER account matches this
      # repository and the release.yml workflow file.
      - name: Log in to nuget.org
        if: steps.version.outputs.publish == 'true'
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      # dotnet nuget push uploads the .snupkg sitting next to the .nupkg to the symbol server, so the
      # symbols ship with the package without a second push.
      - name: Push to nuget.org
        if: steps.version.outputs.publish == 'true'
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: |
          dotnet nuget push "artifacts/nuget/ObjectPoolLinter.${{ steps.version.outputs.version }}.nupkg" \
            --api-key "$NUGET_API_KEY" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate

      # A successful push only means nuget.org accepted the upload; validation and indexing follow.
      # Poll the flat container (what restore reads) until the version is listed, and fail after
      # about 30 minutes so a stuck or rejected package does not pass silently.
      - name: Verify package on nuget.org
        if: steps.version.outputs.publish == 'true'
        run: |
          version="${{ steps.version.outputs.version }}"
          lower=$(echo "$version" | tr '[:upper:]' '[:lower:]')
          url="https://api.nuget.org/v3-flatcontainer/objectpoollinter/index.json"
          for attempt in $(seq 1 60); do
            if curl -fsSL "$url" | grep -q "\"$lower\""; then
              echo "ObjectPoolLinter $version is available on nuget.org."
              exit 0
            fi
            echo "Attempt $attempt: $version not listed yet, retrying in 30s."
            sleep 30
          done
          echo "::error::ObjectPoolLinter $version was pushed but is not available on nuget.org after 30 minutes."
          exit 1

      - name: Create GitHub release
        if: steps.version.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=()
          [ "${{ steps.version.outputs.prerelease }}" = "true" ] && flags+=(--prerelease)
          gh release create "${GITHUB_REF_NAME}" \
            --title "ObjectPoolLinter ${{ steps.version.outputs.version }}" \
            --notes-file artifacts/release-notes.md \
            --verify-tag \
            "${flags[@]}" \
            artifacts/release/* \
            "artifacts/ObjectPoolLinter-${{ steps.version.outputs.version }}.spdx.json"

      - name: Dry run summary
        if: steps.version.outputs.publish != 'true'
        run: |
          {
            echo "### Dry run: ${GITHUB_REF_NAME}"
            echo
            echo "0.x tags build every release artifact but publish nothing. Download them from the"
            echo "\`release-${{ steps.version.outputs.version }}\` artifact on this run."
          } >> "$GITHUB_STEP_SUMMARY"
