name: dependency-review

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Compares the dependency graph of the PR's base and head and fails if the PR adds a dependency, a
  # NuGet package or a GitHub Action, with a known vulnerability of any severity. Dependencies the PR
  # does not touch are covered by NuGet audit and build/check-vulnerable.ps1 in build.yml.
  dependency-review:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: low
